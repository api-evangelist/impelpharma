name: Impelpharma
description: 'Impel Pharmaceuticals is a commercial-stage pharmaceutical company developing first-in-class
  intranasal drug treatments for central nervous system (CNS) disorders with high unmet medical needs.
  Its proprietary Precision Olfactory Delivery (POD) technology targets the vascular-rich upper nasal
  cavity to achieve more rapid and consistent bioavailability than conventional delivery. Its lead
  product, Trudhesa (dihydroergotamine mesylate) nasal spray, is approved for the acute treatment of
  migraine with or without aura in adults. Impel was backed by Norwest Venture Partners (co-led its 2018
  Series D) and later filed for bankruptcy in December 2023. This is a patient- and science-facing pharma
  company with no public developer API, SDK, or documentation surface.'
